name: Lumiere - CI and optional Vercel deployment
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/validation.js
          node --check js/experience.js
          node --check js/interaction-finish.js
          node --check js/lookbook.js
          node --check js/theme.js
          node --check js/hero-video.js
          node --check js/mock-content.js
          node --check js/style-finder.mjs
          node --check js/style-matcher.mjs
      - name: Test dress finder edge cases
        run: node --test tests/*.test.mjs
      - name: Deploy to Vercel when secrets are configured
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
